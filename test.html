<!DOCTYPE html>
<html>
	<head>
		<title>HTML CSS JS</title>
		<!-- YAHOO Global Object source file -->
		<script type="text/javascript" src="http://yui.yahooapis.com/2.9.0/build/yahoo/yahoo-min.js"></script>
		<!-- Fonts CSS - Recommended but not required -->
		<link rel="stylesheet" type="text/css" href="http://yui.yahooapis.com/2.9.0/build/fonts/fonts-min.css" />

		<!-- Core + Skin CSS -->
		<link rel="stylesheet" type="text/css" href="http://yui.yahooapis.com/2.9.0/build/button/assets/skins/sam/button.css" />
		<!-- OPTIONAL: Menu Stylesheet (required for creating buttons of type "menu" and "split") -->
		<link rel="stylesheet" type="text/css" href="http://yui.yahooapis.com/2.9.0/build/menu/assets/skins/sam/menu.css" />

		<!-- Dependencies -->
		<script src="http://yui.yahooapis.com/2.9.0/build/yahoo-dom-event/yahoo-dom-event.js"></script>
		<script src="http://yui.yahooapis.com/2.9.0/build/element/element-min.js"></script>

		<!-- OPTIONAL: Menu and Container Core (required for creating buttons of type "menu" and "split") -->
		<script src="http://yui.yahooapis.com/2.9.0/build/container/container_core-min.js"></script>
		<script src="http://yui.yahooapis.com/2.9.0/build/menu/menu-min.js"></script>

		<!-- Source file -->
		<script src="http://yui.yahooapis.com/2.9.0/build/button/button-min.js"></script>
	</head>
	<body class="yui-skin-sam">
		<h1 id="welcome">HTML CSS JS</h1>
		<input type="checkbox" id="checkbox1" name="field1" value="somevalue" checked />

		<script>
			var oButton = new YAHOO.widget.Button(
				"checkbox1", // Source element id
				{
					checked: false, // Attribute override
					label: "Check me!",
				}
			);
		</script>
	</body>
</html>
